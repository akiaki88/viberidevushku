name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller questionary

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --console --onefile --name "terminal" --collect-all questionary terminal.py

      - name: Check output folder
        run: |
          dir dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: App-Windows
          path: dist/*.exe
